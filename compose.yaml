services:
  task-service:
    build: .
    container_name: task-v1
    ports:
      - "8101:8001"
    environment:
      - MESSAGE=v2
      - APP_VERSION=1.0
    volumes:
      - task-data:/data
    mem_limit: 128m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  task-data: